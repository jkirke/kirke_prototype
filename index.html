<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IBM Bob Agent Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@600;700&display=swap" rel="stylesheet">
  <style>
    /* Sizes are in vw so the layout scales like the 1749px-wide screenshot */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #ffffff;
      color: #000000;
      font-family: "IBM Plex Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 4.9vw;
      padding: 0 1.1vw 0 2vw;
      background: #dadada;
      font-size: 1.15vw;
      font-weight: 600;
      text-transform: uppercase;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 6.4vw;
      text-align: center;
    }

    .logo {
      width: 8.4vw;
      height: 8.4vw;
    }

    h1 {
      margin-top: 1.2vw;
      font-size: 5.6vw;
      font-weight: 700;
      line-height: 1.04;
    }

    .actions {
      display: flex;
      gap: 4.35vw;
      margin-top: 4vw;
    }

    .btn {
      width: 13.8vw;
      height: 4.7vw;
      border: 0;
      border-radius: 1vw;
      background: #2d5ff7;
      color: #ffffff;
      font-family: inherit;
      font-size: 1.85vw;
      font-weight: 600;
      cursor: pointer;
    }

    .btn:hover { background: #1f4de0; }
    .btn:focus-visible { outline: 0.2vw solid #000000; outline-offset: 0.2vw; }
  </style>
</head>
<body>
  <header>
    <span>Katie Kirke</span>
    <span>2026</span>
  </header>

  <main>
    <svg class="logo" viewBox="-70 -70 140 140" fill="none" stroke="#2f6bd0" stroke-width="7" stroke-linecap="butt" aria-hidden="true">
      <!-- spokes -->
      <path d="M0 -50 V-14 M0 50 V14 M-50 0 H-14 M50 0 H14"/>
      <path d="M-31 -28 L-10 -7 M31 -28 L10 -7 M-31 28 L-10 7 M31 28 L10 7"/>
      <!-- center diamond -->
      <path d="M0 -14 L14 0 L0 14 L-14 0 Z" stroke-linejoin="miter"/>
      <!-- nodes -->
      <g fill="#ffffff">
        <circle cx="0" cy="-57" r="9"/>
        <circle cx="0" cy="57" r="9"/>
        <circle cx="-57" cy="0" r="9"/>
        <circle cx="57" cy="0" r="9"/>
        <circle cx="-38" cy="-35" r="9"/>
        <circle cx="38" cy="-35" r="9"/>
        <circle cx="-38" cy="35" r="9"/>
        <circle cx="38" cy="35" r="9"/>
      </g>
    </svg>

    <h1>IBM Bob<br>Agent Management</h1>

    <div class="actions">
      <button type="button" class="btn" onclick="location.href='research1.html'">Research</button>
      <button type="button" class="btn" onclick="location.href='guided1.html'">Guided Demo</button>
      <button type="button" class="btn" onclick="location.href='unguided1.html'">Raw Demo</button>
    </div>
  </main>
</body>
</html>
